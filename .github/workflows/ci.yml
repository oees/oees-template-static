name: ci

# Static site (Tier 1). Runs on every pull request and on every push to main.
# main is protected: a pull request merges only with a green run. App Platform deploys
# each push to main by itself; there is no deploy workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make install
      - run: make check

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks CLI image (no licence needed): full history on push, the PR's commits on PRs.
      - name: Scan for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          log_opts=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            log_opts=(--log-opts "${BASE_SHA}..${HEAD_SHA}")
          fi
          docker run --rm --volume "${GITHUB_WORKSPACE}:/repo" "$GITLEAKS_IMAGE" \
            git --no-banner --redact --verbose "${log_opts[@]}" /repo
