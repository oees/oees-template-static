# DigitalOcean App Platform spec for a static site (Tier 1).
# App Platform builds and deploys every push to main (deploy_on_push). main changes only
# through a reviewed pull request with a green ci, so a merge is a deploy.
# Tech creates the app from this file once. After that, App Platform keeps its own copy:
# a change to this file reaches the app only when tech applies it (docs/deploy-runbook.md).
# Edit only the lines marked EDIT.
# A static site has no secrets: everything here and in the build ships to the browser.
name: website-prod # EDIT: SITE-prod
region: ams # OEES default (EU, same region as the shared cluster). Change only if tech says so.

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

static_sites:
  - name: site
    github:
      repo: oees/website # EDIT: the GitHub repository (owner/name)
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run build
    output_dir: dist
    index_document: index.html
    # Set exactly one of the next two lines.
    error_document: 404.html # multi-page site (default): unknown paths get 404.html
    # catchall_document: index.html # client-routed app only
    # Build-time variables are PUBLIC. Never put a secret here.
    # envs:
    #   - key: VITE_SITE_URL
    #     value: https://www.example.com # EDIT
    #     scope: BUILD_TIME

ingress:
  rules:
    - component:
        name: site
      match:
        path:
          prefix: /

# Add only after tech confirms the hostname and DNS.
# domains:
#   - domain: www.example.com # EDIT
#     type: PRIMARY
